# Release workflow: build the sdist on a git tag and publish it to PyPI
# via OIDC trusted publishing (no API keys / secrets stored in the repo).
#
# **Trigger.** A tag matching `v*` (e.g. `v0.1.0`, `v0.2.0-rc1`). Push it
# with `git tag -a v0.1.0 -m "..." && git push --tags`. The workflow does
# NOT auto-publish on every main push — explicit tag is the gate.
#
# **What it builds.** The sdist plus pre-built wheels (cibuildwheel) for
# CPython 3.10-3.14 on Linux x86_64, macOS x86_64/arm64 and Windows
# AMD64 -- `pip install rawast` lands a binary in seconds instead of a
# local C++ compile. (Linux aarch64 needs qemu-emulated builds and is
# deferred; the abi3 one-wheel-per-platform collapse is M3 scope in
# docs/ROADMAP.md.) The wheels live in THIS file because PyPI's trusted
# publisher is bound to the workflow filename.
#
# **Dry runs.** `workflow_dispatch` builds everything and publishes
# nothing -- validate the wheel matrix without spending a tag.
#
# **Trusted publishing setup (one-time, on PyPI).** Before the first
# release run, log in to https://pypi.org → project / pending project
# → "Publishing" → "Add a new publisher" → GitHub Actions:
#   * PyPI Project Name: rawast
#   * Owner:             edacommons
#   * Repository:        rawast
#   * Workflow:          release.yml
#   * Environment:       pypi
# No API token is generated; PyPI accepts OIDC claims from the workflow
# matching the configured publisher. See
# https://docs.pypi.org/trusted-publishers/ for the full reference.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade build

      - name: Build sdist
        # `--sdist` only — no wheel. scikit-build-core runs in PEP 517
        # build-isolation mode (it pulls scikit-build-core and nanobind
        # into a fresh venv before invoking cmake), so the host runner
        # only needs `build`.
        run: python -m build --sdist

      - name: Verify sdist contents
        # Cheap sanity check: tarball must contain CMakeLists.txt,
        # pyproject.toml, the canonical grammars/ directory, and the
        # C++ engine source. Saves a wasted publish if scikit-build's
        # exclude rules ever drop too much.
        #
        # Extract the listing ONCE into a variable rather than piping
        # `tar | grep -q` four times. `grep -q` exits on first match,
        # which closes its stdin and gives `tar` a SIGPIPE on every
        # subsequent write — under `set -o pipefail` that propagates
        # as a pipeline failure and the step fails with `tar: stdout:
        # write error` even though the file we were looking for is
        # right there. Sourcing the listing first sidesteps the race.
        run: |
          set -euo pipefail
          LISTING=$(tar tzf dist/*.tar.gz)
          echo "$LISTING" | grep -q "CMakeLists.txt$"
          echo "$LISTING" | grep -q "pyproject.toml$"
          echo "$LISTING" | grep -q "grammars/lefdef.rawast$"
          echo "$LISTING" | grep -q "src/grammar.cpp$"
          echo "sdist manifest OK"

      - name: Upload sdist as workflow artifact
        # Stash a copy alongside the workflow run so the publish job can
        # download it (artifacts are how data crosses job boundaries on
        # GitHub Actions). Also useful for manual inspection / debugging
        # if PyPI upload fails downstream.
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          retention-days: 14

  build-wheels:
    name: Wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-13 is the last x86_64 macOS runner; macos-14+ are arm64.
        os: [ubuntu-latest, macos-13, macos-14, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.2.0
        env:
          CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-* cp314-*"
          # 32-bit and musl targets triple the matrix for platforms the
          # corpus has never been run on; the sdist covers them.
          CIBW_SKIP: "*-win32 *_i686 *-musllinux*"
          # std::to_chars for floating point exists from macOS 13.3; the
          # default deployment target predates it and the availability
          # guard refuses. Wheels require 13.3+; older Macs build the
          # sdist, which is what they did before wheels existed.
          CIBW_ENVIRONMENT_MACOS: MACOSX_DEPLOYMENT_TARGET=13.3
          # Import-and-parse is the smoke test: a wheel that ships but
          # cannot load a bundled grammar is worse than no wheel.
          CIBW_TEST_COMMAND: >-
            python -c "import rawast;
            g = rawast.Grammar('json');
            assert g.parse_string('{\"ok\": [1, 2]}') == {'ok': [1, 2]};
            print('wheel OK')"

      - name: Upload wheels as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
          retention-days: 14

  publish:
    name: Publish to PyPI
    # A dispatch run is a dry run: build and test everything, publish
    # nothing. Only a tag push reaches PyPI.
    if: github.event_name == 'push'
    needs: [build-sdist, build-wheels]
    runs-on: ubuntu-latest
    environment:
      # Bind to a named environment on the repo so OIDC tokens carry
      # the `environment: pypi` claim. Trusted-publisher config on
      # PyPI must match this name.
      name: pypi
      url: https://pypi.org/p/rawast
    permissions:
      # `id-token: write` is the OIDC token request permission —
      # required for trusted publishing. No PyPI API token in repo
      # secrets means no key to rotate or accidentally leak.
      id-token: write
    steps:
      - name: Download all distribution artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "*"
          merge-multiple: true
          path: dist

      - name: Publish to PyPI via OIDC
        # The official PyPA action handles the OIDC dance: request a
        # token from GitHub's identity provider, exchange it with PyPI
        # for a short-lived upload credential, run `twine upload`.
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
