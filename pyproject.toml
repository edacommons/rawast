[build-system]
requires = ["scikit-build-core>=0.8", "nanobind>=2.0"]
build-backend = "scikit_build_core.build"

[project]
name = "rawast"
version = "0.1.0"
description = "Universal bidirectional grammar-driven engine for EDA file formats — one grammar drives parse and save for GDSII, LEF, DEF, Tcl, and more."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Serge Rabyking" }]
requires-python = ">=3.10"
keywords = [
    "eda", "vlsi", "chip-design",
    "gdsii", "lef", "def", "tcl",
    "parser", "peg", "grammar", "bidirectional",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
    "Topic :: Software Development :: Compilers",
    "Topic :: Software Development :: Libraries",
    "Topic :: Text Processing :: Markup",
]

[project.urls]
Homepage = "https://github.com/edacommons/rawast"
Source   = "https://github.com/edacommons/rawast"
Issues   = "https://github.com/edacommons/rawast/issues"
Funding  = "https://github.com/sponsors/lanserge"

[project.scripts]
rawast = "rawast.cli:main"

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.scikit-build]
minimum-version = "0.8"
cmake.version = ">=3.20"
cmake.build-type = "Release"
wheel.packages = ["python/rawast"]
# Trim the sdist. Defaults pull in everything tracked; these
# patterns drop files that aren't needed by a `pip install
# rawast-X.Y.Z.tar.gz` build (dev-only metadata, CI workflows,
# the dereferenced `python/rawast/grammars` symlink dup).
sdist.exclude = [
    # uv development lock — not a runtime dependency, just a
    # convenience for the maintainer's editable install.
    "uv.lock",
    # CI / repo metadata that an end-user installing from sdist
    # doesn't need (the GitHub Actions workflows assume the full
    # repo clone, not the unpacked sdist).
    ".github",
    # `python/rawast/grammars` is a symlink to `grammars/` in the
    # repo (lets the editable install resolve `grammar_path(...)`
    # against the live grammar tree). scikit-build-core
    # dereferences it when packing the sdist, producing a 150KB
    # duplicate of the grammar files. CMake's `install(DIRECTORY
    # ${CMAKE_SOURCE_DIR}/grammars/ DESTINATION rawast/grammars
    # ...)` rule copies them into the wheel at build time, so
    # the sdist genuinely doesn't need them under
    # python/rawast/grammars/.
    "python/rawast/grammars",
]

[tool.scikit-build.cmake.define]
RAWAST_BUILD_TESTS = "OFF"

[tool.pytest.ini_options]
testpaths = ["python/tests"]

[dependency-groups]
dev = [
    "pydantic>=2.13.4",
]
